<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Pneumonia Detection System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            AI Pneumonia Detection
        </div>

        <div class="nav-links">

            <a href="/history">
                Patient History
            </a>

            <a href="/dashboard">
                Dashboard
            </a>

        </div>

    </header>

    <!-- Main Container -->

    <div class="container">

        <h1>AI Pneumonia Detection System</h1>

        <p class="subtitle">
            Upload a chest X-ray image for automated pneumonia screening using a trained CNN model with Grad-CAM visualization.
        </p>

        <div class="upload-box">

                 <form
                    action="/upload"
                    method="POST"
                    enctype="multipart/form-data"
                    autocomplete="off"
                >

                <!-- Patient Information -->

                <h2>Patient Information</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label for="patient_name">Patient Name</label>

                        <input
                            type="text"
                            id="patient_name"
                            name="patient_name"
                            placeholder="Enter Patient Name"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="patient_id">Patient ID</label>

                        <input
                            type="text"
                            id="patient_id"
                            name="patient_id"
                            placeholder="Enter Patient ID"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="age">Age</label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="0"
                            max="120"
                            placeholder="Enter Age"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="gender">Gender</label>

                        <select
                            id="gender"
                            name="gender"
                            required
                        >

                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="doctor_name">Doctor Name</label>

                        <input
                            type="text"
                            id="doctor_name"
                            name="doctor_name"
                            placeholder="Optional"
                        >

                    </div>

                    <div class="form-group">

                        <label for="hospital">Hospital / Clinic</label>

                        <input
                            type="text"
                            id="hospital"
                            name="hospital"
                            placeholder="Optional"
                        >

                    </div>

                </div>

                <!-- Upload Section -->

                <h2>Chest X-ray</h2>

                <div class="preview-box">

                    <img
                        id="previewImage"
                        src="https://placehold.co/500x350/f3f4f6/6b7280?text=Chest+X-ray+Preview"
                        alt="Chest X-ray Preview"
                    >

                </div>

                <input
                    type="file"
                    id="imageInput"
                    name="image"
                    accept=".jpg,.jpeg,.png"
                    required
                >

                <button type="submit">

                    Analyze X-ray

                </button>

            </form>

        </div>

    </div>

    <script>

        const imageInput = document.getElementById("imageInput");
        const previewImage = document.getElementById("previewImage");

        imageInput.addEventListener("change", function () {

            const file = this.files[0];

            if (file) {

                previewImage.src = URL.createObjectURL(file);

            }

        });

    </script>

</body>

</html>
